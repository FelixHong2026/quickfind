name: build

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Needed so the release step can create a Release and upload assets
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pin to a well-supported version rather than the newest release.
          python-version: '3.12'

      - name: Install build dependency
        run: pip install -r requirements-build.txt

      - name: Syntax check
        run: python -m py_compile src\quickfind.py src\quickfind_locales.py src\installer.py

      # --onedir (not --onefile): onefile re-extracts the whole bundle into
      # %TEMP%\_MEIxxxx on every launch, which is slow and leaves _MEI* junk behind.
      - name: Build QuickFind (onedir)
        # NOTE: --icon / --add-data paths resolve relative to --specpath (build\), so use
        # absolute paths here; otherwise PyInstaller looks for build\assets\quickfind.ico.
        run: >
          pyinstaller --noconfirm --onedir --windowed --name QuickFind
          --icon "${{ github.workspace }}\assets\quickfind.ico"
          --add-data "${{ github.workspace }}\assets\quickfind.ico;assets"
          --distpath release --workpath build\work --specpath build src\quickfind.py

      - name: Zip portable build
        run: Compress-Archive -Path release\QuickFind -DestinationPath release\QuickFind-portable.zip -Force
        shell: pwsh

      - name: Build QuickFind-Setup.exe
        # NOTE: paths are resolved relative to --specpath (build\), so use an absolute path.
        # The whole onedir tree is embedded under _MEIPASS\QuickFind and copied out on install.
        run: >
          pyinstaller --noconfirm --onefile --console --name QuickFind-Setup
          --add-data "${{ github.workspace }}\release\QuickFind;QuickFind"
          --distpath release --workpath build\work2 --specpath build src\installer.py

      - name: Show artefacts
        run: |
          Get-ChildItem release -File | Select-Object Name, Length
          Get-ChildItem release\QuickFind | Select-Object -First 5 Name, Length
        shell: pwsh

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: QuickFind-windows-x64
          path: |
            release/*.exe
            release/*.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
